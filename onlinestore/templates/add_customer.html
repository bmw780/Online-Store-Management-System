{% extends 'base.html' %}
{% block title %}Add Customer{% endblock %}
{% block content %}
<div class="page-title">👤 Add Customer</div>
<div class="card" style="max-width:680px">
  <form method="POST">
    <div class="form-grid">
      <div class="form-group">
        <label>Full Name *</label>
        <input name="name" required placeholder="Arjun Kumar">
      </div>
      <div class="form-group">
        <label>Email *</label>
        <input name="email" type="email" required placeholder="arjun@mail.com">
      </div>
      <div class="form-group full">
        <label>Phone Numbers <span style="color:#999;font-weight:normal">(comma-separated — stored in CUSTOMER_PHONE)</span></label>
        <input name="phones" placeholder="9876543210, 9123456789">
      </div>
      <div class="form-group full" style="border-top:1px solid #eee;padding-top:14px;margin-top:4px">
        <label style="color:#1a237e">Delivery Address</label>
      </div>
      <div class="form-group full">
        <label>Street</label>
        <input name="street" placeholder="12 Anna Nagar">
      </div>
      <div class="form-group">
        <label>City</label>
        <input name="city" placeholder="Chennai">
      </div>
      <div class="form-group">
        <label>State</label>
        <input name="state" placeholder="Tamil Nadu">
      </div>
      <div class="form-group">
        <label>Pincode</label>
        <input name="pincode" placeholder="600040">
      </div>
    </div>
    <div style="margin-top:20px;display:flex;gap:10px">
      <button class="btn btn-primary" type="submit">Add Customer</button>
      <a href="/customers" class="btn btn-outline">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
