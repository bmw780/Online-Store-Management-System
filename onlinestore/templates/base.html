<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Online Store{% endblock %} — DA3</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f0f2f5; color: #222; min-height: 100vh; }

  /* NAV */
  nav { background: #1a237e; color: #fff; display: flex; align-items: center; padding: 0 24px; height: 56px; gap: 0; }
  nav .brand { font-size: 17px; font-weight: bold; color: #fff; text-decoration: none; margin-right: 32px; }
  nav a { color: #c5cae9; text-decoration: none; padding: 0 14px; height: 56px; display: flex; align-items: center; font-size: 14px; transition: background .15s; }
  nav a:hover, nav a.active { background: #283593; color: #fff; }

  /* LAYOUT */
  .container { max-width: 1100px; margin: 28px auto; padding: 0 20px; }
  .page-title { font-size: 22px; font-weight: bold; color: #1a237e; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }

  /* CARDS */
  .card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.1); padding: 24px; margin-bottom: 20px; }
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
  .stat-card { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.08); border-left: 4px solid var(--color); }
  .stat-card .num { font-size: 28px; font-weight: bold; color: var(--color); }
  .stat-card .label { font-size: 13px; color: #777; margin-top: 4px; }

  /* TABLES */
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { background: #1a237e; color: #fff; padding: 10px 14px; text-align: left; font-weight: 500; }
  td { padding: 9px 14px; border-bottom: 1px solid #eee; }
  tr:hover td { background: #f5f7ff; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; }
  .badge-pending  { background: #fff3e0; color: #e65100; }
  .badge-paid     { background: #e8f5e9; color: #2e7d32; }
  .badge-shipped  { background: #e3f2fd; color: #1565c0; }
  .badge-delivered{ background: #e8f5e9; color: #1b5e20; }
  .badge-processing{ background: #f3e5f5; color: #6a1b9a; }

  /* FORMS */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group.full { grid-column: 1/-1; }
  label { font-size: 13px; font-weight: 600; color: #444; }
  input, select, textarea { padding: 9px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; width: 100%; }
  input:focus, select:focus { outline: none; border-color: #1a237e; box-shadow: 0 0 0 2px #e8eaf6; }

  /* BUTTONS */
  .btn { padding: 9px 20px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; font-weight: 500; transition: opacity .15s; }
  .btn:hover { opacity: .85; }
  .btn-primary { background: #1a237e; color: #fff; }
  .btn-success { background: #2e7d32; color: #fff; }
  .btn-danger  { background: #c62828; color: #fff; font-size: 12px; padding: 5px 12px; }
  .btn-sm      { padding: 5px 12px; font-size: 12px; }
  .btn-outline { background: #fff; color: #1a237e; border: 1px solid #1a237e; }

  /* FLASH */
  .flash { padding: 12px 18px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; }
  .flash-success { background: #e8f5e9; color: #2e7d32; border-left: 4px solid #2e7d32; }
  .flash-error   { background: #ffebee; color: #c62828; border-left: 4px solid #c62828; }

  /* MISC */
  .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .section-header h2 { font-size: 16px; color: #333; }
  .empty { text-align: center; padding: 40px; color: #999; font-size: 14px; }
  .product-row { display: flex; gap: 10px; align-items: flex-end; background: #f8f9ff; padding: 12px; border-radius: 6px; border: 1px solid #e8eaf6; margin-bottom: 8px; }
  .product-row .form-group { flex: 1; }
</style>
</head>
<body>
<nav>
  <a class="brand" href="/">🛒 OnlineStore</a>
  <a href="/" {% if request.path=='/' %}class="active"{% endif %}>Dashboard</a>
  <a href="/customers" {% if '/customers' in request.path %}class="active"{% endif %}>Customers</a>
  <a href="/products" {% if '/products' in request.path or '/categories' in request.path %}class="active"{% endif %}>Products</a>
  <a href="/orders" {% if '/orders' in request.path %}class="active"{% endif %}>Orders</a>
  <a href="/reports" {% if '/reports' in request.path %}class="active"{% endif %}>Reports</a>
</nav>

<div class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="flash flash-{{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
