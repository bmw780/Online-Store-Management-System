{% extends 'base.html' %}
{% block title %}Add Product{% endblock %}
{% block content %}
<div class="page-title">➕ Add Product</div>
<div class="card" style="max-width:560px">
  <form method="POST">
    <div class="form-grid">
      <div class="form-group full">
        <label>Product Name *</label>
        <input name="name" required placeholder="Wireless Earbuds">
      </div>
      <div class="form-group">
        <label>Category *</label>
        <select name="category_id" required>
          <option value="">Select category</option>
          {% for c in categories %}
          <option value="{{ c.category_id }}">{{ c.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Price (₹) *</label>
        <input name="price" type="number" step="0.01" min="0" required placeholder="1499.00">
      </div>
      <div class="form-group">
        <label>Stock Quantity *</label>
        <input name="stock_qty" type="number" min="0" required placeholder="50">
      </div>
    </div>
    <div style="margin-top:20px;display:flex;gap:10px">
      <button class="btn btn-primary" type="submit">Add Product</button>
      <a href="/products" class="btn btn-outline">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
